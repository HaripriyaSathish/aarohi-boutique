<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Secure payment · Vetri Boutique</title>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <style>
    :root { --rose:#8a2846; --ink:#2b2024; --muted:#7a6b70; --bg:#fbf7f4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); padding:24px 16px; }
    .card { width:100%; max-width:420px; background:#fff; border-radius:20px; padding:28px 22px; text-align:center;
            box-shadow:0 10px 30px rgba(43,32,36,.08); }
    h1 { font-size:20px; margin:0 0 4px; }
    .amount { font-size:30px; font-weight:700; color:var(--rose); margin:14px 0; }
    .muted { color:var(--muted); font-size:14px; line-height:1.5; }
    .spinner { width:38px; height:38px; border:4px solid #eadfe2; border-top-color:var(--rose); border-radius:50%;
               margin:18px auto; animation:spin 0.9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    button { width:100%; min-height:52px; border:0; border-radius:14px; background:var(--rose); color:#fff;
             font-size:16px; font-weight:600; margin-top:16px; }
    .test { background:#fff6e5; color:#8a5a00; border-radius:12px; padding:10px 12px; font-size:13px; margin-top:14px; }
    #msg { color:#b3261e; font-size:14px; min-height:20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Vetri Boutique</h1>
    <div class="muted">Order {{ order.number }}</div>
    <div class="amount">₹{{ order.total }}</div>
    <div class="spinner" id="spin"></div>
    <p class="muted" id="status">Opening secure Cashfree checkout…</p>
    <p id="msg" aria-live="polite"></p>
    <button id="pay" type="button" hidden>Pay ₹{{ order.total }} with Cashfree</button>
    {% if mode == "sandbox" %}
      <div class="test"><strong>TEST MODE</strong> — no real money is charged. Use Cashfree test UPI / card details.</div>
    {% endif %}
  </div>
  <script>
    (function () {
      var session = "{{ session|escapejs }}";
      var mode = "{{ mode|escapejs }}";
      var btn = document.getElementById("pay");
      function start() {
        document.getElementById("msg").textContent = "";
        if (!window.Cashfree) {
          document.getElementById("spin").hidden = true;
          document.getElementById("status").textContent = "Could not load Cashfree. Check your internet and try again.";
          btn.hidden = false;
          return;
        }
        try {
          window.Cashfree({ mode: mode }).checkout({ paymentSessionId: session, redirectTarget: "_self" });
        } catch (e) {
          document.getElementById("msg").textContent = "Could not open checkout. Tap the button to retry.";
          btn.hidden = false;
        }
      }
      btn.addEventListener("click", start);
      if (document.readyState === "complete") start(); else window.addEventListener("load", start);
    })();
  </script>
</body>
</html>
