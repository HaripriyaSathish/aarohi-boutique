{% extends "admin/change_list.html" %}
{% load static %}
{% block extrastyle %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'css/admin_orders.css' %}">
{% endblock %}
{% block content %}
    <div class="order-metrics">
        <div>
            <strong>
                Verified sales
            </strong>
            <p>
                ₹{{ sales_total }}
            </p>
        </div>
        <div>
            <strong>
                Awaiting fulfillment
            </strong>
            <p>
                {{ pending_orders }}
            </p>
        </div>
        <div>
            <strong>
                Low-stock variants (&lt;5)
            </strong>
            <p>
                {{ low_stock }}
            </p>
        </div>
    </div>
    {{ block.super }}
{% endblock %}
